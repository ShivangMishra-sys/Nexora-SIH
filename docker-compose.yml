version: "3.9"

services:
  # ─── PostgreSQL + PostGIS + TimescaleDB [55][69] ──────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    environment:
      POSTGRES_DB: urbanflow
      POSTGRES_USER: urbanflow
      POSTGRES_PASSWORD: urbanflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflow"]
      interval: 10s
      retries: 5

  # ─── Redis (pub/sub + Celery broker) [54] ─────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://urbanflow:urbanflow@postgres:5432/urbanflow
      REDIS_URL: redis://redis:6379/0
      WBT_PATH: /opt/whitebox/WBT
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
    volumes:
      - datastore:/data   # shared DEM/OSM/SWMM cache + snapshots
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ─── Celery worker [54] ───────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://urbanflow:urbanflow@postgres:5432/urbanflow
      REDIS_URL: redis://redis:6379/0
      WBT_PATH: /opt/whitebox/WBT
    volumes:
      - datastore:/data
    depends_on:
      - redis
      - postgres
    restart: on-failure

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ─── MQTT broker (mosquitto) [42] ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata:
  datastore:
